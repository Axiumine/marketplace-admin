# Endpoint: /admin-authenticated-resource (marketplace-dev-admin-authenticated-resource, port 4024)
#
# Hand-maintained slice — see the header of public-authorization.graphql for why there is no SDL to
# pull. Verified on 2026-08-02 against every file under src/graphQLApi/schema/ of that service, plus
# the two shared fragments in marketplace-common (GraphQLBaseAddressFrag, GraphQLPositionFrag).
# The keygrip query, mutation and three types were transcribed on 2026-08-12, against
# queries/keygripStatus.mts, mutations/keygripRotate.mts and types/GraphQLKeygripStatus.mts as they
# stood after E01-S13 and E01-S14.
#
# This is the only endpoint that serves domain data to the operator app. Everything the app queries
# that is not login / refresh / logout goes here.

schema {
	query: QueriesApi
	mutation: MutationsApi
}

"""
graphql-scalars' DateTime, as mounted by the service. Serialised as an ISO-8601 string.
"""
scalar DateTime

"""
graphql-scalars' Date — a calendar day with no time part (YYYY-MM-DD). Used only for `birth.date`
on input; the output type reports the same field as DateTime, which is the schema's own asymmetry and
not a transcription error.
"""
scalar Date

type QueriesApi {
	"""
	The authenticated operator's own identity, read straight out of the Redis session — no database
	round-trip. This is the query that proves a session is live, which is what the app uses it for.
	"""
	infoAdminAfterLogin: GraphQLAdminInfoAfterLogin!

	"""
	One page of the operator table, filtered to the shopOwners that are neither disabled nor
	soft-deleted. Every argument has a server-side default, so `shopOwnersActiveTbl { … }` with no
	arguments is a legal first page.
	"""
	shopOwnersActiveTbl(
		offset: Int! = 0
		limit: Int! = 25
		search: String
		sortBy: GraphQLShopOwnersTblSortField! = REGISTERED_AT
		sortDir: GraphQLSortDirection! = DESC
	): GraphQLShopOwnersActiveTblPage!

	"""
	Headline count of shopOwners. Unfiltered — this is NOT `total` from the table page, which is the
	size of the searched set and changes as the operator types.
	"""
	shopOwnersStats: Int!

	"""
	The shopOwners-over-time series behind the stats chart. Unfiltered on the same terms as
	`shopOwnersStats`, so the points sum to that number.

	`granularity` is a RESPONSE field, not an argument: the bucket width is a consequence of the range,
	so `ALL` answers one point per month and the two bounded ranges one per day. A client able to ask
	for day buckets over the whole life of the platform would be asking for a point per day since it
	opened. Buckets are UTC, and a month bucket is stamped with its own first day — `data` is
	`YYYY-MM-DD` in both granularities.
	"""
	shopOwnersPerPeriod(period: GraphQLShopOwnersPeriod! = ALL): GraphQLShopOwnersPerPeriod!

	shopOwnerById(idShopOwner: ID!): GraphQLShopOwnerById!

	"""
	The companies belonging to one shopOwner. Filtered on `idShopOwner` **and** on `deleted`, like
	the shops: since `companyDel` became a soft delete the collection does have a deleted-but-present
	state, and a retired company left in this list would be offered by the shop form's picker and then
	refused by the write.
	"""
	shopOwnerCompanies(idShopOwner: ID!): [GraphQLCompany!]!

	"""
	The cookie-signing key set as it stands right now, plus which services have read it and are signing
	with what they read. No arguments, and in particular no `version`: this reads the live record, and
	the platform keeps no older one to ask for.

	⚠️ Nothing here is key material and nothing here ever may be — the ids are counters, `createdAt` is
	a date and the fingerprint is a sha256 over the ordered ids. See the note on
	`GraphQLKeygripStatus`.
	"""
	keygripStatus: GraphQLKeygripStatus!

	"""
	The live sessions one account is holding, newest login first (E17-S02).

	Both halves of the account, always: ids come from three separate collections and nothing stops two of
	them minting the same `ObjectId`, so a query by id alone could list — and then end — a stranger's
	sessions. The tier is an enum rather than a `String` because it is a *lookup* key: a typo would
	otherwise be a successful query over an empty keyspace, which reads exactly like a clean account.

	⚠️ Nothing here is a credential and nothing here ever may be — see the note on `GraphQLSession`.
	"""
	sessions(tier: GraphQLTier!, accountId: String!): [GraphQLSession!]!

	"""
	The refresh-token replays recorded against one account, newest first (E17-S05).

	Bounded and expiring at the store: the newest 50 lines, kept 30 days. An account with none answers an
	empty list, which is the ordinary case and not an error.
	"""
	reuseEvents(tier: GraphQLTier!, accountId: String!): [GraphQLReuseEvent!]!
}

type MutationsApi {
	"""
	Changes the authenticated operator's OWN password. There is deliberately no `_id` argument: the
	account is taken from the Redis session, because every operator authenticates against the same
	collection and the platform has no role field that could tell one from another. Answers 401 for a
	wrong old password, a disabled/deleted account, or a session naming an account that no longer
	exists — all four indistinguishable on purpose. 400 if the new password is outside 10..72
	characters or equal to the old one.
	"""
	adminUpdatePwd(passwordOld: String!, passwordNew: String!): Boolean!

	shopOwnerAdd(login: GraphQLInputLogin!, personalData: GraphQLInputShopOwnerPersonalData!): Boolean!
	shopOwnerUpdate(_id: ID!, personalData: GraphQLInputShopOwnerPersonalData!): Boolean!
	shopOwnerDel(_id: ID!): Boolean!

	"""
	Changes `login.email` — the credential, not `personalData.contacts.email`. Its own mutation because it
	is the only field on the collection with a unique index behind it: answers 409 when the address
	already belongs to another shopOwner, 400 when it is malformed, 404 when `_id` matches nothing.
	"""
	shopOwnerUpdateEmail(_id: ID!, email: String!): Boolean!

	"""
	The disable switch and the manual-approval gate. Both arguments are required: a partial update
	cannot express turning a flag *off*, since "leave alone" and "clear it" are the same wire value.
	`false` REMOVES the field rather than storing false — `waitApprov: { $exists: true }` is how the
	approval queue is built.
	"""
	shopOwnerUpdateStatus(_id: ID!, disabled: Boolean!, waitApprov: Boolean!): Boolean!

	"""
	The three preference fields under `login`. Opposite rule to `shopOwnerUpdateStatus`: the two
	booleans are declared `bool` on the collection and are stored as false, while `onboardingStep` is
	optional and is removed when blank or omitted.
	"""
	shopOwnerUpdatePreferences(_id: ID!, rememberMe: Boolean!, onboardingDone: Boolean!, onboardingStep: String): Boolean!

	"""
	The operator's note about the account, at most 2000 characters. Its own mutation because it is not
	part of the personalData — `shopOwnerUpdate` replaces that whole sub-document, and the note sits at
	the top level of the shopOwner. `notes` is `String!` and not nullable on purpose: the empty string
	is how the note is cleared (the resolver turns it into an `$unset`), so a nullable argument would
	give "leave it alone" and "remove it" the same wire value. 400 over the cap, 404 on an unknown `_id`.
	"""
	shopOwnerUpdateNote(_id: ID!, notes: String!): Boolean!

	"""
	Creates one company under an shopOwner. Answers 409 on either unique index (`vatNumber_unique`,
	`certifiedEmail_unique`, both GLOBAL — one VAT number is one company, whoever registered it), 400 naming the
	offending path, and 404 when `idShopOwner` names no shopOwner. `Boolean!`, not the new `_id`:
	the page re-reads `shopOwnerCompanies` after a save.

	A company has to exist before a shop can point at it, so this is the first step of adding a shop to
	an shopOwner who has none — not a side page.
	"""
	companyAdd(idShopOwner: ID!, company: GraphQLInputCompany!): Boolean!

	"""
	Rewrites one company's data. Same input object as `companyAdd`, minus the owner: `idShopOwner` is
	neither an argument nor a field of `GraphQLInputCompany`, so editing a card cannot hand the company —
	and its shops with it — to another shopOwner. Same 409 / 400, 404 when `_id` matches no company.
	"""
	companyUpdate(_id: ID!, company: GraphQLInputCompany!): Boolean!

	"""
	Retires one company — a soft delete: the company keeps its place and gains a `deleted` instant, and every
	read path filters on it. 404 when `_id` matches no company; a company already retired answers 200
	again, since the `$set` still matches it.

	⚠️ `vatNumber_unique` and `certifiedEmail_unique` are plain global unique indexes with no `partialFilterExpression`,
	so a retired company keeps its VAT number occupied and the same one cannot be registered again.
	"""
	companyDel(_id: ID!): Boolean!

	"""
	Mints a new cookie-signing key for the whole platform and retires the ones nothing can still be
	signed with.

	⚠️ No arguments, and in particular no key material and no version: what the new key is, and which
	number it lands under, are decided by the service. A mutation that accepted either would let its
	caller install a key of their choosing, which is the ability to mint a session cookie for any
	account on the platform.

	`Boolean!` for the same reason — the answer is "it happened", never the keys. What an operator
	needs afterwards is `keygripStatus`, which reads the ids and never the material. 409 when another
	rotation swapped the record first (the Lua compare-and-set lost), 500 when this service cannot
	unwrap the record under its own `KEYGRIP_KEK`.
	"""
	keygripRotate: Boolean!

	"""
	Drops one cookie-signing key from the whole platform, logging out everyone whose cookie it signed.

	One argument, and it is an id — never key material, never a version. The id is public by construction:
	`keygripStatus` renders it and the fingerprint is computed over the ids.

	⚠️ **The service refuses to retire the key that is currently signing**, and the panel does not offer it
	at all — an operator who could reach that button would be one click from invalidating every cookie on
	the platform, including their own. 404 when no key in the record has this id, which is a real failure
	and must be shown as one: a stale screen naming a key a rotation has already replaced would otherwise
	read as a successful retire that did nothing.
	"""
	keygripRetire(id: String!): Boolean!

	"""
	Ends one session of one account and stops it being listed (E17-S03).

	`id` is the row's own id from `sessions` — the digest of the session key, never a token. Answers
	whether a *live* session was ended: a row whose session had already expired answers `false` and still
	prunes the index, and the screen says "already ended" rather than reporting an error, because an
	operator told "error" retries a call that has already done everything it can.

	⚠️ Ends the refresh lineage. An access token already minted from it keeps working until its own short
	expiry — the residual is real, is the same one the `disabled` flag carries, and the confirmation text
	says so.
	"""
	revokeSession(tier: GraphQLTier!, accountId: String!, id: String!): Boolean!

	"""
	Ends every session one account holds and answers how many there were (E17-S03, E17-S04).

	⚠️ **One account, by construction — there is no "every account" form and there will not be one.** It
	would be a single call that logs out the whole platform, and no incident this console exists for is
	answered by it.

	The count is what was actually revoked, never more: a login landing mid-revoke keeps its session and is
	left out of the total rather than claimed.
	"""
	revokeAllSessions(tier: GraphQLTier!, accountId: String!): Int!
}

type GraphQLAdminInfoAfterLogin {
	_id: ID!
	email: String!
}

"""
⚠️ **No type below has a `material` field, and none of them ever may** (ADR-034, E01-S14). These three
describe the record that holds the platform's cookie-signing keys: a reader of one could sign a session
cookie for any account on the platform, which is a strictly larger power than "may rotate the keys" —
the one this screen exists to grant. The service asserts the absence by field name in its own schema
test, so a field added there fails a test rather than changing a snapshot; transcribing one here would
only make this slice lie about it.

`version` is what a rotation bumps and `fingerprint` is the record's own — a sha256 over the ordered key
ids, which is what makes publishing it harmless. Together they are how an operator tells two records
apart without seeing either.
"""
type GraphQLKeygripStatus {
	version: Int!
	fingerprint: String!
	keys: [GraphQLKeygripKeyInfo!]!
	holders: [GraphQLKeygripHolder!]!
}

"""
One key in the set. `ageDays` is computed by the service rather than left to the browser: the
retirement rule is "older than the remembered-session cap", and it is the server's clock that decides,
so a screen doing that arithmetic against the browser's clock could offer a key as retirable while the
rotation refuses it. `createdAt` is a `String` and not the `DateTime` scalar — that is the service's
own declaration, and it puts an ISO-8601 stamp on the wire either way.
"""
type GraphQLKeygripKeyInfo {
	id: String!
	createdAt: String!
	ageDays: Int!
}

"""
One service that has read the record and is signing with what it read.

`current` is answered by the service rather than by the browser comparing two strings, for the reason
`ageDays` is computed there: the comparison is against the record this very read returned, so the two
cannot be a rotation apart. A row is absent rather than `current: false` once its service has stopped
heartbeating for an hour — absent and stale mean different things: gone, versus here and behind.
"""
type GraphQLKeygripHolder {
	service: String!
	fingerprint: String!
	lastSeen: String!
	current: Boolean!
}

"""
Which collection an account authenticates against — the platform's whole notion of a role (ADR-002).

Transcribed from `types/GraphQLTier.mts`, which builds its values from `TIER` rather than spelling them.
A fifth tier appears there the moment it exists and cannot appear before, so the only way this list goes
stale is a hand-edit here that the service's own schema test would not see. It is a segment of the session
index key: a value the service did not know would name a key that has never existed, and the console would
answer "no sessions" for an account holding several.
"""
enum GraphQLTier {
	admin
	shopOwner
	user
}

"""
Why a lineage was revoked (E17-S05).

⚠️ **The one enum in this slice with a test on the other side proving the two lists are equal** (E17-S01):
the service builds `GraphQLReuseEventAction` from `REUSE_EVENT_ACTIONS` and asserts the value sets match,
so a third case added to that constant fails the service's suite until it is transcribed here. Without
that, drift would surface as an operator reading a blank cell rather than as a failing build.

⚠️ **An operator's own revocation is not a value here.** E17's open question 4 answered "not
attributable"; a case for it would answer that question by accident and would need its own retention
decision.
"""
enum GraphQLReuseEventAction {
	"""
	A consumed refresh token was presented again, past the grace window (E14-S02/S03).
	"""
	refreshTokenReplayed
	"""
	The session reached its absolute age cap, measured from the login it descends from (E14-S05).
	"""
	sessionCapReached
}

"""
One live session of one account (E17-S02).

⚠️ **No field here is capable of holding a token, and none ever may be** (BCON-01, E17 §2). `id` is the
session index field — the SHA-256 of the prefixed refresh token — and it is safe to render *and* to send
back because every raw-token key on the platform carries an `access:` / `refresh:` prefix that a bare
digest does not: the digest names no live key and authenticates nothing. The service's schema test
enumerates these four field names against an exact expected set, so a fifth fails a test rather than
quietly reaching this screen.

⚠️ **Nothing network- or device-derived either** — no address, not truncated, not hashed, not salted. That
is the standing decision, and it is why an operator cannot answer "where was this session used from" here.
The answer to a compromise report is to end the sessions.

`mintedAt` is epoch millis as a string, and it is the *login* this session descends from rather than its
last rotation — a session refreshing every fifteen minutes must not read as freshly created. Two rows
sharing a `familyId` are one login seen either side of a rotation race, which is the only thing that
explains a duplicate an operator would otherwise read as a second device.
"""
type GraphQLSession {
	id: String!
	tier: GraphQLTier!
	mintedAt: String!
	familyId: String!
}

"""
One line of an account's reuse trail (E17-S05).

⚠️ **Five fields, and the omissions are the contract** — no token, no digest of one, no prefix of one,
nothing network-derived. `familyId` is the handle the revocation was issued against, which is what ties a
line here to the rows `sessions` no longer returns: a mass logout an operator can explain instead of a
mystery ticket. `at` is epoch millis as a string, as it is stored.
"""
type GraphQLReuseEvent {
	familyId: String!
	tier: GraphQLTier!
	accountId: String!
	action: GraphQLReuseEventAction!
	at: String!
}

"""
One page of the operator table. `total` is the size of the FILTERED set, not of the collection.
"""
type GraphQLShopOwnersActiveTblPage {
	items: [GraphQLShopOwnerActiveTbl!]!
	total: Int!
}

"""
The four columns the table can order by. Value-less on the backend, so the resolver receives the enum
NAME and maps it to a Mongo path itself. Each one has a matching index in marketplace-db-setup
(`tbl_active_*`); a column not listed here has no index and is refused at schema validation rather
than turned into a blocking in-memory sort.
"""
enum GraphQLShopOwnersTblSortField {
	REGISTERED_AT
	FIRST_NAME
	LAST_NAME
	CITY
}

enum GraphQLSortDirection {
	ASC
	DESC
}

"""
How far back the stats chart looks. `ALL` runs from the month the first shopOwner registered in
to the current one; the other two are counted back from today, clamped to the target month's length
(one month before 31 March is 28 February, not 3 March).
"""
enum GraphQLShopOwnersPeriod {
	ALL
	THREE_MONTHS
	ONE_MONTH
}

"""
The width of one bucket. Derived from the range by the server — see `shopOwnersPerPeriod`.
"""
enum GraphQLPeriodGranularity {
	DAY
	MONTH
}

type GraphQLShopOwnersPerPeriod {
	granularity: GraphQLPeriodGranularity!
	points: [GraphQLShopOwnersPerPeriodPoint!]!
}

type GraphQLShopOwnersPerPeriodPoint {
	"""
	Bucket start, `YYYY-MM-DD`. A plain String and not the `Date` scalar: the service builds it with
	`$dateToString` in the aggregation, so it is a string on the wire in both granularities.
	"""
	date: String!

	"""
	Registrations in this bucket. Gaps are filled server-side, so an empty bucket is present with `0`
	rather than absent — the series is contiguous and the client never interpolates.
	"""
	total: Int!
}

type GraphQLShopOwnerActiveTbl {
	_id: ID!
	registeredAt: DateTime!
	"""
	The address the account authenticates with, flattened out of `login` by the resolver. On a
	self-registered row it is the only thing identifying the account: `personalData` below is absent
	until onboarding runs.
	"""
	email: String!
	"""
	⚠️ **Nullable, and the resolver agrees — do not "tidy" it back to `GraphQLPersonalData!`.** A seller
	who signed themselves up through `shopOwnerRegister` has an address and a password and nothing else,
	so this whole block is missing on exactly the rows an operator opened the table to approve. `items`
	is a non-null list of non-null rows, so one such row under a `NonNull` here errors the entire page.
	"""
	personalData: GraphQLPersonalData
	"""
	Present and true while the account waits for an operator. `$unset` on approval, so it is never
	`false` — render "pending" on truthiness, not on equality.
	"""
	waitApprov: Boolean
}

type GraphQLPersonalData {
	firstName: String!
	lastName: String!
	address: GraphQLShopOwnerAddressTbl!
}

type GraphQLShopOwnerAddressTbl {
	street: String!
	postalCode: String!
	city: String!
	province: String!
}

type GraphQLShopOwnerById {
	_id: ID!
	login: GraphQLShopOwnerLogin!
	"""
	⚠️ **Nullable, for the reason the table's is.** This is the page an operator opens to decide whether
	to approve a self-registration, and a self-registration has no `personalData` at all — under a
	`NonNull` the one account that needs looking at is the one that cannot be looked at.
	"""
	personalData: GraphQLShopOwnerPersonalDataById
	registeredAt: DateTime!
	deleted: DateTime
	disabled: Boolean
	waitApprov: Boolean
	"""
	The operator's free-text note about this account, at most 2000 characters. Absent until one is
	written; `shopOwnerUpdateNote` removes the field again when the note is cleared.
	"""
	notes: String
	resetPwd: GraphQLResetPwd
}

type GraphQLShopOwnerLogin {
	email: String!
	firstLogin: DateTime
	lastLogin: DateTime
	onboardingStep: String
	onboardingDone: Boolean
	rememberMe: Boolean
}

type GraphQLShopOwnerPersonalDataById {
	firstName: String!
	lastName: String!
	address: GraphQLShopOwnerAddress!
	birth: GraphQLBirth!
	contacts: GraphQLShopOwnerContacts!
}

type GraphQLShopOwnerAddress {
	street: String!
	postalCode: String!
	city: String!
	province: String!
	"""
	⚠️ **Nullable, unlike `GraphQLCompanyPosition!`.** The point was added to the
	collection by 20260802000300 as an optional field and nothing backfilled it — `collMod` does not
	re-validate stored documents, and there is nothing to derive a coordinate from without geocoding —
	so every shopOwner that existed before the migration answers `null` here until an address is
	picked from the autocomplete and saved.
	"""
	position: GraphQLPositionShopOwner
}

"""
GeoJSON `Point`, same shape as `GraphQLCompanyPosition` under a name of its own — a GraphQL schema has
one flat type namespace, so the two tiers cannot share the fragment's output type. `coordinates` is
[longitude, latitude].
"""
type GraphQLPositionShopOwner {
	type: String!
	coordinates: [Float!]!
}

type GraphQLBirth {
	date: DateTime!
}

type GraphQLShopOwnerContacts {
	email: String!
	landline: String
	mobile: String!
}

"""
Present only while a password reset is pending. The migration declares both members required under a
strict validator, so the pair is written and cleared as a whole — never one without the other.
"""
type GraphQLResetPwd {
	resetDateReq: DateTime!
	resetHash: String!
}

"""
A company, as its own entity — the `company` collection since migration 20260803000000.

`idShopOwner` is exposed rather than kept internal: the operator app reaches a company through its
owner's detail page, and the field is what a client re-reading one company can check it against.

`taxCode` and `uniqueCode` are the two nullable fields, matching the collection's `required` array. `taxCode` is new
with the extraction and no stored company carries one.
"""
type GraphQLCompany {
	_id: ID!
	idShopOwner: ID!
	legalName: String!
	vatNumber: String!
	taxCode: String
	contactPerson: String!
	administrator: String!
	uniqueCode: String
	certifiedEmail: String!
	address: GraphQLCompanyAddress!
	"""
	The path of the uploaded registryExtract, not the document. Required, and capped at 1000 characters by the
	collection — it was the one unbounded string on the embedded shape.
	"""
	registryExtract: String!
}

"""
The company's legal seat — not the address of any of its shops. Same four fields and the same GeoJSON
point as `GraphQLShopOwnerAddress`, under a name of its own: a GraphQL schema has one flat type
namespace, so two collections' addresses cannot share one type without a field added to either
appearing on both.
"""
type GraphQLCompanyAddress {
	street: String!
	postalCode: String!
	city: String!
	province: String!
	position: GraphQLCompanyPosition!
}

"""
GeoJSON `Point`. `coordinates` is [longitude, latitude], in that order — not the other way round,
and not a pair of named fields. Float, because a latitude is not an integer.
"""
type GraphQLCompanyPosition {
	type: String!
	coordinates: [Float!]!
}

input GraphQLInputLogin {
	email: String!
	password: String!
}

input GraphQLInputShopOwnerPersonalData {
	firstName: String!
	lastName: String!
	birth: GraphQLInputBirth!
	address: GraphQLInputAddress!
	contacts: GraphQLInputContacts!
}

input GraphQLInputBirth {
	date: Date!
}

input GraphQLInputAddress {
	street: String!
	postalCode: String!
	city: String!
	province: String!
	"""
	⚠️ **Coordinates only and nullable.** No `type` field, like `GraphQLInputCompanyPosition` — the
	resolver adds `type: 'Point'`. Nullable because the operator can save personal data whose
	address was never re-picked. ⚠️ Omitting it does **not** preserve the stored point:
	`shopOwnerUpdate` `$set`s the whole `personalData`, so a save without `position` erases it. Send
	back the point the query returned whenever the address is left alone.
	"""
	position: GraphQLInputAddressPosition
}

input GraphQLInputAddressPosition {
	coordinates: [Float!]!
}

input GraphQLInputContacts {
	mobile: String!
	landline: String
	email: String!
}

"""
Everything the operator types about a company, in one object — one form and one Save, which is also what
lets `companyUpdate` `$set` the document in a single atomic write.

`_id` and `idShopOwner` are deliberately absent: the first is minted by the service, the second is a
separate argument on `companyAdd` and is nowhere on the update path, so a company cannot be moved to
another owner by editing its card.

`taxCode` and `uniqueCode` are the two optional ones, mirroring the collection's `required` array. Both are
dropped rather than stored empty when blank — sending `null` for them is legal on the wire and the
service reads it as "not set".
"""
input GraphQLInputCompany {
	legalName: String!
	vatNumber: String!
	taxCode: String
	contactPerson: String!
	administrator: String!
	uniqueCode: String
	certifiedEmail: String!
	address: GraphQLInputCompanyAddress!
	registryExtract: String!
}

input GraphQLInputCompanyAddress {
	street: String!
	postalCode: String!
	city: String!
	province: String!
	position: GraphQLInputCompanyPosition!
}

"""
⚠️ **Coordinates only.** This input has no `type` field: the value has exactly one legal spelling
(`Point`), the collection caps it at 5 characters and the model declares it as an enum of one, so
accepting it from a client would only be a way to receive `point` or `POINT` and fail the write
naming a field the operator never saw. The service writes the literal.
"""
input GraphQLInputCompanyPosition {
	coordinates: [Float!]!
}
