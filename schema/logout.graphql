# Endpoint: /logout (marketplace-dev-authenticated-logout, port 4030)
#
# Hand-maintained slice — see the header of public-authorization.graphql. Verified on 2026-08-01
# against src/graphQLApi/schema/mutations.mts and src/graphQLApi/schema/mutations/logout.mts.
#
# The service is filed under the ShopOwner tier in the platform docs, and the admin app calls it
# anyway. That is correct, not a leak: `authorizationLogoutHandler` resolves the bearer token straight
# out of Redis and never opens a collection, so it is tier-agnostic by construction. The resolver
# deletes the refresh key, deletes the access key if one is present, clears the cookie, and returns
# `true` whatever happened — a logout that fails still has to log the admin out.

schema {
	query: QueriesApi
	mutation: MutationsApi
}

type QueriesApi {
	helloLogout: String!
}

type MutationsApi {
	logout: Boolean!
}
